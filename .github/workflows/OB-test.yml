name: Orderbook Test Cron Job

on:
  schedule:
    # 9:00 UTC+7 = 2:00 UTC, 14:00 UTC+7 = 7:00 UTC
    - cron: '0 2,7 * * *'
  workflow_dispatch:

jobs:
  run-chart-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Run Cypress Orderbook Test
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run cy:run-chart -- --spec "e2e/orderbook/compare_OB_with_latest.cy.ts"
